name: vlf-v16-vianli-nli
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned inference stack
        run: pip install "torch==2.7.1" "transformers==4.53.2" "safetensors>=0.4.3" "scikit-learn==1.7.1" requests
      - name: Run independent ViANLI SUT
        run: |
          python - <<'PY'
          import json,requests,hashlib,pathlib,torch
          from transformers import AutoTokenizer,AutoModelForSequenceClassification
          from sklearn.metrics import accuracy_score,f1_score,confusion_matrix,classification_report
          MODEL="Inori612/phobert-base-vianli-ph"
          TEST="https://huggingface.co/datasets/uitnlp/ViANLI/resolve/main/vianli_test.jsonl"
          DEV="https://huggingface.co/datasets/uitnlp/ViANLI/resolve/main/vianli_dev.jsonl"
          raw=requests.get(TEST,timeout=60); raw.raise_for_status()
          draw=requests.get(DEV,timeout=60); draw.raise_for_status()
          pathlib.Path("vianli_test.jsonl").write_bytes(raw.content)
          pathlib.Path("vianli_dev.jsonl").write_bytes(draw.content)
          rows=[json.loads(x) for x in raw.text.splitlines() if x.strip()]
          dev=[json.loads(x) for x in draw.text.splitlines() if x.strip()]
          assert len(rows)==1000 and len(dev)==1000
          tok=AutoTokenizer.from_pretrained("vinai/phobert-base")
          model=AutoModelForSequenceClassification.from_pretrained(MODEL); model.eval()
          print("id2label",model.config.id2label,"label2id",model.config.label2id)
          semantic={"entailment","neutral","contradiction"}
          import itertools
          def raw_predict(items):
              ids=[]; probs=[]
              for i in range(0,len(items),16):
                  b=items[i:i+16]
                  enc=tok([x["premise"] for x in b],[x["hypothesis"] for x in b],padding=True,truncation=True,max_length=256,return_tensors="pt")
                  with torch.no_grad(): logits=model(**enc).logits
                  ids += logits.argmax(-1).tolist()
                  probs += torch.softmax(logits,-1).max(-1).values.tolist()
              return ids,probs
          cfg={int(k):str(v).lower() for k,v in model.config.id2label.items()}
          mapping_source="MODEL_CONFIG"
          if set(cfg.values())==semantic:
              id2=cfg; dev_acc=None
          else:
              # Calibrate opaque LABEL_0/1/2 on validation only; never use test labels for mapping.
              dids,_=raw_predict(dev); dgold=[str(x["label"]).lower() for x in dev]
              candidates=[]
              for perm in itertools.permutations(sorted(semantic)):
                  m=dict(zip(sorted(set(dids)),perm))
                  acc=sum(m[x]==y for x,y in zip(dids,dgold))/len(dgold)
                  candidates.append((acc,m))
              candidates.sort(key=lambda x:x[0],reverse=True)
              if len(candidates)<2 or candidates[0][0]<=candidates[1][0]:
                  raise RuntimeError("AMBIGUOUS_DEV_LABEL_MAPPING")
              dev_acc,id2=candidates[0]; mapping_source="VALIDATION_CALIBRATION_LOCKED_BEFORE_TEST"
          pids,probs=raw_predict(rows); preds=[id2[x] for x in pids]
          gold=[str(x["label"]).lower() for x in rows]
          assert set(gold)<=semantic
          report={"n":len(rows),"model":MODEL,"id2label":id2,"label_mapping_source":mapping_source,"label_mapping_dev_accuracy":dev_acc,
            "accuracy":accuracy_score(gold,preds),
            "macro_f1":f1_score(gold,preds,average="macro"),
            "confusion_matrix_labels":["entailment","neutral","contradiction"],
            "confusion_matrix":confusion_matrix(gold,preds,labels=["entailment","neutral","contradiction"]).tolist(),
            "classification_report":classification_report(gold,preds,labels=["entailment","neutral","contradiction"],output_dict=True,zero_division=0),
            "mean_max_probability":sum(probs)/len(probs),
            "dataset_sha256":hashlib.sha256(raw.content).hexdigest(),"dev_sha256":hashlib.sha256(draw.content).hexdigest(),
            "construct":"3-way Vietnamese adversarial NLI only",
            "empirical_state":"MEASURED_BOUNDED_INDEPENDENT_SUT"}
          pathlib.Path("evidence").mkdir(exist_ok=True)
          pathlib.Path("evidence/VIANLI_NLI_REPORT.json").write_text(json.dumps(report,ensure_ascii=False,indent=2))
          with open("evidence/predictions.jsonl","w") as f:
              for r,p,q in zip(rows,preds,probs): f.write(json.dumps({"uid":r["uid"],"gold":r["label"],"prediction":p,"confidence":q},ensure_ascii=False)+"\n")
          pathlib.Path("evidence/model_config.json").write_text(model.config.to_json_string())
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vlf-v16-vianli-nli-evidence
          path: evidence/
