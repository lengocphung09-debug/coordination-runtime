name: AIPF TEVV19 NIST Juliet Probe

on:
  pull_request:
    paths:
      - '.github/workflows/tevv19-nist-juliet-probe.yml'
      - 'tevv/juliet_aipf_exact_cwe_map.tsv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  juliet-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Acquire official NIST SARD Juliet C/C++ 1.3
        shell: bash
        run: |
          set -euo pipefail
          url='https://samate.nist.gov/SARD/downloads/test-suites/2017-10-01-juliet-test-suite-for-c-cplusplus-v1-3.zip'
          curl -L --fail --retry 3 "$url" -o juliet-1.3.zip
          sha256sum juliet-1.3.zip | tee juliet.sha256
          test "$(sha256sum juliet-1.3.zip | awk '{print $1}')" = "ada9d7e1c323d283446df3f55bdee0d00bda1fed786785fe98764d58688f38eb"
          unzip -q juliet-1.3.zip -d juliet

      - name: Probe exact CWE coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,pathlib,re,collections,hashlib
          wanted=list(csv.DictReader(open('tevv/juliet_aipf_exact_cwe_map.tsv',encoding='utf-8'),delimiter='\t'))
          root=pathlib.Path('juliet')
          folders=collections.defaultdict(set)
          source_counts=collections.Counter()
          for p in root.rglob('*'):
              if p.is_dir():
                  m=re.search(r'CWE(\d+)_',p.name)
                  if m:
                      folders[int(m.group(1))].add(str(p.relative_to(root)))
              elif p.suffix.lower() in {'.c','.cpp','.cc','.cxx'}:
                  m=re.search(r'CWE(\d+)_',str(p))
                  if m:
                      source_counts[int(m.group(1))]+=1
          out=[]
          for r in wanted:
              cwe=int(r['CWE'])
              out.append({
                **r,
                'CWE':cwe,
                'Juliet_Directories':sorted(folders.get(cwe,set())),
                'Source_File_Count':source_counts.get(cwe,0),
                'Exact_CWE_Available':bool(folders.get(cwe)) and source_counts.get(cwe,0)>0
              })
          pathlib.Path('tevv19_juliet_exact_cwe_coverage.jsonl').write_text(
            ''.join(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n' for x in out),encoding='utf-8')
          summary={
            'Revision':'AIPF-TEVV19-NIST-JULIET-PROBE-20261007',
            'Authority':'NIST SARD Juliet C/C++ 1.3 suite #112',
            'Expected_SHA256':'ada9d7e1c323d283446df3f55bdee0d00bda1fed786785fe98764d58688f38eb',
            'Requested_AIPF_Leaves':len(out),
            'Exact_CWE_Available_Leaves':sum(x['Exact_CWE_Available'] for x in out),
            'Exact_CWE_Unavailable_Leaves':sum(not x['Exact_CWE_Available'] for x in out),
            'Available_Item_IDs':[x['Item_ID'] for x in out if x['Exact_CWE_Available']],
            'Unavailable_Item_IDs':[x['Item_ID'] for x in out if not x['Exact_CWE_Available']],
            'Probe_Is_Not_Empirical_Validation':True
          }
          pathlib.Path('tevv19_juliet_probe_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: tevv19-nist-juliet-probe
          retention-days: 7
          if-no-files-found: error
          path: |
            juliet.sha256
            tevv19_juliet_exact_cwe_coverage.jsonl
            tevv19_juliet_probe_summary.json
            tevv/juliet_aipf_exact_cwe_map.tsv
