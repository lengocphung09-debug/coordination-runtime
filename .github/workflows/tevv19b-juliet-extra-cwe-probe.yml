name: AIPF TEVV19B NIST Juliet Extra CWE Probe

on:
  pull_request:
    paths:
      - '.github/workflows/tevv19b-juliet-extra-cwe-probe.yml'
      - 'tevv/juliet_extra_cwe_map.tsv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Acquire official NIST Juliet C/C++ 1.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://samate.nist.gov/SARD/downloads/test-suites/2017-10-01-juliet-test-suite-for-c-cplusplus-v1-3.zip' -o juliet-1.3.zip
          test "$(sha256sum juliet-1.3.zip | awk '{print $1}')" = "ada9d7e1c323d283446df3f55bdee0d00bda1fed786785fe98764d58688f38eb"
          sha256sum juliet-1.3.zip > juliet.sha256
          unzip -q juliet-1.3.zip -d juliet
      - name: Probe exact CWE directories
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,pathlib,re,collections
          rows=list(csv.DictReader(open('tevv/juliet_extra_cwe_map.tsv'),delimiter='\t'))
          root=pathlib.Path('juliet/C/testcases')
          out=[]
          for r in rows:
              cwe=int(r['CWE'])
              dirs=sorted(str(p.relative_to(root)) for p in root.glob(f'CWE{cwe}_*') if p.is_dir())
              files=[]
              for d in dirs:
                  q=root/d
                  files += [str(p.relative_to(root)) for p in q.rglob('*') if p.suffix.lower() in {'.c','.cpp','.cc','.cxx'}]
              out.append({**r,'CWE':cwe,'Juliet_Directories':dirs,'Source_File_Count':len(files),'Exact_CWE_Available':bool(dirs and files)})
          pathlib.Path('tevv19b_coverage.jsonl').write_text(''.join(json.dumps(x,separators=(',',':'))+'\n' for x in out))
          summary={'Revision':'AIPF-TEVV19B-20261007','Requested':len(out),'Available':sum(x['Exact_CWE_Available'] for x in out),
                   'Available_Items':[x['Item_ID'] for x in out if x['Exact_CWE_Available']],
                   'Unavailable_Items':[x['Item_ID'] for x in out if not x['Exact_CWE_Available']],
                   'Corpus_Presence_Is_Not_Strict_Closure':True}
          pathlib.Path('tevv19b_summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: tevv19b-juliet-extra-cwe-probe
          retention-days: 7
          path: |
            juliet.sha256
            tevv19b_coverage.jsonl
            tevv19b_summary.json
            tevv/juliet_extra_cwe_map.tsv
