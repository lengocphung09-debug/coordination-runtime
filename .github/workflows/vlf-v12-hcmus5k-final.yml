name: VLF v12 HCMUS5K Final
on:
  push:
    branches: [vlf-v12-hcmus5k-final]
jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request
          u='https://huggingface.co/api/datasets/pqthinh232/vietnamese-correction-60k/parquet'
          x=json.load(urllib.request.urlopen(u))
          urls=x['default']['test']
          assert urls
          with open('URLS.txt','w') as fh:
              for item in urls:
                  print(item,file=fh)
          PY
          i=0
          while IFS= read -r u; do
            curl -L --fail --retry 3 -o "test_$i.parquet" "$u"
            i=$((i+1))
          done < URLS.txt
          sha256sum test_*.parquet > SHA256SUMS.txt\n          python -m pip install -q pyarrow pandas\n          python - <<'PY'\n          import pandas as pd,glob\n          d=pd.concat([pd.read_parquet(f) for f in sorted(glob.glob('test_*.parquet'))],ignore_index=True)\n          d.to_csv('test.csv',index=False)\n          print('ROWS',len(d),'COLS',list(d.columns))\n          PY\n          sha256sum test.csv > CSV_SHA256.txt
          wc -c test_*.parquet > SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vlf-v12-hcmus5k-final
          path: |
            test_*.parquet
            SHA256SUMS.txt
            SIZE.txt
            URLS.txt\n            test.csv\n            CSV_SHA256.txt
          retention-days: 1
