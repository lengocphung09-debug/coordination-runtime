name: DA10 isolated-runner smoke
on:
  push:
    branches:
      - experiment/da10-comp-emp-001
  pull_request:
    branches:
      - main
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        arm: [A7, A9, A10R, A11]
    runs-on: ubuntu-latest
    steps:
      - name: Environment identity
        run: |
          echo "arm=${{ matrix.arm }}"
          uname -a
          python3 --version
          git --version
      - name: Outbound corpus acquisition smoke
        run: |
          git clone --depth 1 https://github.com/bears-bugs/bears-benchmark.git bears
          test -d bears
          git -C bears rev-parse HEAD
      - name: Isolation marker
        run: |
          mkdir -p evidence
          printf '{"arm":"%s","runner":"github-actions","status":"SMOKE_PASS"}\n' "${{ matrix.arm }}" > evidence/${{ matrix.arm }}.json
          sha256sum evidence/${{ matrix.arm }}.json
