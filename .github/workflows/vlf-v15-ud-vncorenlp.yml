name: vlf-v15-ud-vncorenlp
permissions:
  contents: write
on:
  push:
    branches: [vlf-v15-ud-vncorenlp]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch canonical resources
        run: |
          git clone --depth 1 https://github.com/vncorenlp/VnCoreNLP.git vncorenlp
          git clone --depth 1 https://github.com/UniversalDependencies/UD_Vietnamese-VTB.git ud
          mkdir -p evidence
          sha256sum vncorenlp/VnCoreNLP-1.2.jar > evidence/resource_sha256.txt
          git -C vncorenlp rev-parse HEAD > evidence/vncorenlp_commit.txt
          git -C ud rev-parse HEAD > evidence/ud_commit.txt
      - name: Prepare raw test sentences
        run: |
          python3 - <<'PY'
          import pathlib
          p=next(pathlib.Path("ud").glob("*test.conllu"))
          sents=[]; cur=[]
          for line in p.read_text(encoding="utf-8").splitlines()+[""]:
              if not line.strip():
                  if cur:
                      text=""
                      for form,misc in cur:
                          text += form
                          if "SpaceAfter=No" not in misc: text += " "
                      sents.append(text.rstrip()); cur=[]
              elif not line.startswith("#"):
                  cols=line.split("\t")
                  if cols[0].isdigit():
                      cur.append((cols[1], cols[9] if len(cols)>9 else "_"))
          assert sents, "no reconstructed sentences"
          pathlib.Path("input.txt").write_text("\n".join(sents)+"\n",encoding="utf-8")
          pathlib.Path("evidence/test_sentence_count.txt").write_text(str(len(sents)))
          print("reconstructed",len(sents),"sentences")
          PY
      - name: Run independent VnCoreNLP predictions
        run: |
          java -Xmx2g -jar vncorenlp/VnCoreNLP-1.2.jar -fin input.txt -fout predictions.txt -annotators wseg,pos,parse
          test -s predictions.txt
          cp predictions.txt evidence/predictions.txt
          sha256sum input.txt predictions.txt >> evidence/resource_sha256.txt
      - name: Score corpus segmentation and safely aligned UAS
        run: |
          python3 - <<'PY'
          import pathlib,json,re
          gold=next(pathlib.Path("ud").glob("*test.conllu")).read_text(encoding="utf-8")
          gs=[]; cur=[]
          for line in gold.splitlines()+[""]:
              if not line.strip():
                  if cur: gs.append(cur); cur=[]
              elif not line.startswith("#"):
                  x=line.split("\t")
                  if x[0].isdigit(): cur.append(x)
          ps=[]; cur=[]
          for line in pathlib.Path("predictions.txt").read_text(encoding="utf-8").splitlines()+[""]:
              if not line.strip():
                  if cur: ps.append(cur); cur=[]
              else:
                  x=line.split("\t")
                  if len(x)>=6 and x[0].isdigit(): cur.append(x)
          assert gs and ps
          # Segmentation metric over syllable boundaries, independent of sentence resegmentation.
          def units(form): return form.replace("_"," ").split()
          def boundaries(sents):
              pos=0; B=set(); seq=[]
              for s in sents:
                  for row in s:
                      us=units(row[1])
                      for u in us: seq.append(u)
                      pos += len(us); B.add(pos)
              return seq,B
          gseq,gb=boundaries(gs); pseq,pb=boundaries(ps)
          same_stream=(gseq==pseq)
          if same_stream:
              tp=len(gb&pb); prec=tp/len(pb) if pb else 1.0; rec=tp/len(gb) if gb else 1.0
              f1=2*prec*rec/(prec+rec) if prec+rec else 0.0
          else: prec=rec=f1=None
          # Greedy surface alignment of sentence blocks; UAS only exact token sequences.
          def surf(s): return " ".join(u for r in s for u in units(r[1]))
          j=0; exact=0; uas_num=uas_den=0
          for g in gs:
              target=surf(g); acc=""; block=[]
              while j<len(ps) and len(acc)<len(target):
                  block += ps[j]; acc=surf([block]); j+=1
                  if acc==target: break
              if acc==target and [r[1] for r in g]==[r[1] for r in block]:
                  exact+=1
                  # VnCoreNLP CLI: ID FORM POS NER HEAD DEPREL
                  for a,b in zip(g,block):
                      try: gh=int(a[6]); ph=int(b[4])
                      except: continue
                      uas_den+=1; uas_num += (gh==ph)
          report={"gold_sentences":len(gs),"pred_sentence_blocks":len(ps),
            "same_underlying_syllable_stream":same_stream,
            "segmentation_boundary_precision":prec,"segmentation_boundary_recall":rec,"segmentation_boundary_f1":f1,
            "exact_token_aligned_gold_sentences":exact,
            "aligned_uas_tokens":uas_den,"aligned_uas":uas_num/uas_den if uas_den else None,
            "LAS":"NOT_IDENTIFIABLE_PENDING_LABEL_MAPPING",
            "construct_limits":"Segmentation scored only if underlying syllable stream is identical. UAS scored only on exact-token aligned gold sentences; external-engine adapter evidence, not intrinsic VLF universal syntax capability.",
            "empirical_state":"MEASURED_BOUNDED_EXTERNAL_ENGINE" if same_stream else "NOT_IDENTIFIABLE_STREAM_MISMATCH"}
          pathlib.Path("evidence/UD_VTB_VNCORENLP_REPORT.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vlf-v15-ud-vncorenlp-evidence
          path: evidence/

      - name: Persist evidence to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p empirical-results/ud-vncorenlp
          cp -f evidence/* empirical-results/ud-vncorenlp/ 2>/dev/null || true
          git add empirical-results/ud-vncorenlp
          git diff --cached --quiet || git commit -m "Persist VLF v1.5 UD VnCoreNLP empirical evidence"
          git push origin HEAD:vlf-v15-ud-vncorenlp